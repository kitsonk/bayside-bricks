name: CI/CD

# Replaces the legacy Deno Deploy workflow (.github/workflows/deploy.yml,
# deployctl -> Deno Deploy project `bayside-bricks`), retired with the move to
# Cloudflare Workers (MIGRATION_INVENTORY.md §11.1).
#
# Pipeline
#   CI        `.github/workflows/ci.yml`: install, typecheck, build, deploy dry
#             run and route-table tests on every push and PR. No secrets.
#   preview   PRs only:       upload an immutable Worker version, assert the
#                             live production deployment was not touched, smoke
#                             the preview URL, upsert one sticky PR comment
#   production push to main:  deploy the commit, then smoke the deployed Worker
#
# The deploy jobs rebuild from the same commit/lockfile that CI verified rather
# than downloading CI's artefact: artefacts are not shared across workflow runs,
# and a rebuild is required anyway to produce the adapter's `dist/server/
# wrangler.json`. Merge-time gating therefore comes from requiring the `CI`
# workflow (branch protection) — plus the post-deploy smoke below, which fails
# the job if the deployed Worker is unhealthy.
#
# Required repository secrets (see web/docs/deploy.md):
#   CLOUDFLARE_API_TOKEN    scoped Workers + zone token, nothing else
#                           (Workers Scripts: Edit + Workers Routes: Edit —
#                           the production job attaches the custom domain
#                           declared in web/wrangler.jsonc)
#   CLOUDFLARE_ACCOUNT_ID   Cloudflare account id
# Optional repository variable (may live on the `Production` environment):
#   PRODUCTION_URL          public URL to smoke after deploy. Unset until the
#                           DNS cutover: the Worker is verified on its
#                           workers.dev host, which the deploy step discovers.
#
# Production hostname: bricks.kitandsimon.com, declared as a `routes` entry
# with `custom_domain: true` in web/wrangler.jsonc. The adapter copies it into
# dist/server/wrangler.json, so `wrangler deploy` is the single source of truth
# for the binding — no dashboard step. Deploying that route works while the
# zone is still pending (it serves once the registrar points at Cloudflare).
# `wrangler versions upload` (previews) ignores triggers entirely, so a PR
# cannot move production traffic or rewrite the production route.
#
# Preview URLs are a separate per-Worker switch (Workers & Pages → the Worker →
# Settings → Preview URLs) and a production `wrangler deploy` turned it off
# once, silently suppressing the `Version Preview URL:` line. The preview job
# therefore re-asserts it on every run, preserving the workers.dev/route switch
# exactly as the deploy job left it. See web/docs/deploy.md.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    # The Astro/Workers app lives in web/ until the scaffold is promoted to the
    # repository root (tracked by t_bc7cf085). Keep every path relative to it.
    working-directory: web
    # Required, not cosmetic: the deploy steps pipe wrangler's output into `tee`
    # to scrape the deployed URL. GitHub's default shell is `bash -e {0}`, which
    # has no `pipefail`, so the pipeline would exit with `tee`'s status (0) and a
    # failed deploy would report success. Explicit `bash` runs with `-eo pipefail`.
    shell: bash

jobs:
  # Deploying needs Cloudflare credentials. Rather than fail red on a repo
  # without them, detect once and let the deploy jobs no-op with a warning —
  # a fork, a fresh clone or a local secret-less run still gets a green CI on
  # the part that can actually run (verify). See web/docs/deploy.md.
  prerequisites:
    name: Deploy prerequisites
    runs-on: ubuntu-latest
    timeout-minutes: 2
    defaults:
      run:
        working-directory: .
    outputs:
      deploy: ${{ steps.check.outputs.deploy }}
    steps:
      - name: Check Cloudflare credentials
        id: check
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "Cloudflare credentials present."
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CLOUDFLARE_API_TOKEN and/or CLOUDFLARE_ACCOUNT_ID are not set — deploy jobs will be skipped. See web/docs/deploy.md."
          fi

  preview:
    name: Preview deployment (PR)
    # Same-repo PRs only: fork PRs get no secrets, so they cannot deploy.
    # Inputs used in shell below are numeric (PR number) or a commit SHA.
    #
    # Isolation model — a preview must not be able to affect production:
    #   * it uploads an immutable version (`wrangler versions upload`) and never
    #     `wrangler deploy`, so no traffic moves and no deployment is created;
    #   * it never declares `environment: Production`, so it cannot borrow the
    #     production environment's secrets or protection rules;
    #   * the "Assert production was not touched" step reads the live
    #     deployment before and after the upload and fails the job if either
    #     the active deployment id or its version changed — the guarantee is
    #     tested on every PR rather than assumed;
    #   * it refuses a preview URL that is the production host (see the URL
    #     parsing below).
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.prerequisites.outputs.deploy == 'true'
    needs: [prerequisites]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node (from web/.nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Preview URLs are a per-Worker setting, independent of workers.dev and of
      # any route. A production `wrangler deploy` has already turned it off once
      # (the #6 custom-domain deploy), and when it is off wrangler silently
      # stops printing `Version Preview URL:` — so the preview job must own it
      # rather than assume it. Enabling is idempotent and never touches
      # `enabled` (the workers.dev/route traffic switch), so production's
      # semantics are left exactly as the deploy job set them.
      - name: Ensure preview URLs are enabled
        id: previews
        env:
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKER: bayside-bricks
        run: |
          set -euo pipefail
          api=https://api.cloudflare.com/client/v4
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          worker=$(curl -sS --retry 3 --retry-delay 2 -H "$auth" \
            "$api/accounts/$CF_ACCOUNT_ID/workers/workers/$WORKER")
          if [ "$(jq -r '.success // false' <<<"$worker")" != "true" ]; then
            echo "::error::could not read the $WORKER Worker record — the token needs Workers Scripts: Edit"
            jq -r '.errors[]?.message' <<<"$worker" || true
            exit 1
          fi
          enabled=$(jq -r '.result.subdomain.enabled // false' <<<"$worker")
          previews=$(jq -r '.result.subdomain.previews_enabled // false' <<<"$worker")
          suffix=$(jq -r '.result.subdomain.preview_url_suffix // ""' <<<"$worker")
          if [ "$previews" != "true" ]; then
            echo "Preview URLs are disabled on $WORKER — enabling them (workers.dev/route traffic left at enabled=$enabled)."
            body=$(jq -nc --argjson enabled "$enabled" '{enabled: $enabled, previews_enabled: true}')
            resp=$(curl -sS --retry 3 --retry-delay 2 -X POST -H "$auth" \
              -H 'content-type: application/json' --data "$body" \
              "$api/accounts/$CF_ACCOUNT_ID/workers/scripts/$WORKER/subdomain")
            if [ "$(jq -r '.success // false' <<<"$resp")" != "true" ]; then
              echo "::error::could not enable preview URLs on $WORKER"
              jq -r '.errors[]?.message' <<<"$resp" || true
              exit 1
            fi
            echo "::notice::enabled preview URLs on $WORKER; a production deploy had left them off."
          fi
          if [ -z "$suffix" ]; then
            echo "::error::Cloudflare returned no preview_url_suffix for $WORKER — cannot derive a preview URL"
            exit 1
          fi
          echo "suffix=$suffix" >> "$GITHUB_OUTPUT"
          echo "Preview URL suffix: $suffix (workers.dev enabled=$enabled)"

      # Baseline for the isolation assertion after the upload.
      - name: Record the live production deployment
        id: baseline
        run: |
          set -euo pipefail
          if ! json=$(npx wrangler deployments status -c dist/server/wrangler.json --json 2>/dev/null); then
            echo "::warning::could not read the live deployment; isolation will be asserted on the preview URL and production health only"
            json='{}'
          fi
          deployment=$(jq -r '.id // ""' <<<"$json")
          version=$(jq -r '.versions[0].version_id // ""' <<<"$json")
          echo "deployment=$deployment" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Active production deployment before this run: ${deployment:-unknown} (version ${version:-unknown})"

      # An immutable version + preview URL: uploads without moving production
      # traffic. Production stays on the last `wrangler deploy` until merged.
      - name: Upload preview version
        id: upload
        run: |
          set -euo pipefail
          npx wrangler versions upload -c dist/server/wrangler.json \
            --tag "pr-${{ github.event.pull_request.number }}" \
            --message "PR #${{ github.event.pull_request.number }} @ ${{ github.event.pull_request.head.sha }}" \
            | tee version-upload.log

          # Parse the lines wrangler labels. Grepping for "the first workers.dev
          # URL" is unsafe: the production host is a workers.dev URL too, so a
          # wrong match would smoke — and pass — against production and call it
          # a preview.
          url=$(grep -F 'Version Preview URL:' version-upload.log | grep -oE 'https://[^[:space:]]+' | head -n1 || true)
          version=$(grep -F 'Worker Version ID:' version-upload.log | grep -oE '[0-9a-f]{8}-[0-9a-f-]{27}' | head -n1 || true)
          # wrangler prints the preview URL only when it also manages to read the
          # Worker's subdomain settings; the URL itself is deterministic —
          # https://<first 8 chars of the version id><preview_url_suffix> — so
          # derive it rather than fail a working upload on a log line.
          if [ -z "$url" ] && [ -n "$version" ]; then
            url="https://${version:0:8}${{ steps.previews.outputs.suffix }}"
            echo "No 'Version Preview URL:' line in wrangler's output; derived $url from the version id."
          fi
          if [ -z "$url" ]; then
            echo "::error::could not determine the preview URL: no 'Version Preview URL:' line and no 'Worker Version ID:' to derive it from"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Preview URL: $url (version ${version:-unknown})"

      # The load-bearing check for "previews cannot affect production".
      - name: Assert production was not touched
        env:
          BASELINE_DEPLOYMENT: ${{ steps.baseline.outputs.deployment }}
          BASELINE_VERSION: ${{ steps.baseline.outputs.version }}
          PREVIEW_URL: ${{ steps.upload.outputs.url }}
          PREVIEW_VERSION: ${{ steps.upload.outputs.version }}
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          set -euo pipefail

          # Every hostname production can be served from. `enabled: false` on
          # the Worker today means the workers.dev host 404s rather than serving
          # the site, but it is production's URL the moment that flag flips
          # back, so a preview must never be any of these.
          preview_host=${PREVIEW_URL#https://}
          preview_host=${preview_host%%/*}
          for host in \
            'bayside-bricks.me-6d3.workers.dev' \
            'bricks.kitandsimon.com' \
            "${PRODUCTION_URL:+${PRODUCTION_URL#https://}}"; do
            [ -n "$host" ] || continue
            host=${host%%/*}
            if [ "$preview_host" = "$host" ]; then
              echo "::error::the preview URL host ($preview_host) is production's ($host) — this is not a preview"
              exit 1
            fi
          done
          echo "Preview host $preview_host is not any production host."

          if [ -n "$BASELINE_DEPLOYMENT" ]; then
            json=$(npx wrangler deployments status -c dist/server/wrangler.json --json)
            now_deployment=$(jq -r '.id // ""' <<<"$json")
            now_version=$(jq -r '.versions[0].version_id // ""' <<<"$json")
            echo "production before: $BASELINE_DEPLOYMENT / $BASELINE_VERSION"
            echo "production after:  $now_deployment / $now_version"
            if [ "$now_deployment" != "$BASELINE_DEPLOYMENT" ] || [ "$now_version" != "$BASELINE_VERSION" ]; then
              echo "::error::the preview upload changed the active production deployment — isolation is broken"
              exit 1
            fi
            if [ -n "$PREVIEW_VERSION" ] && [ "$PREVIEW_VERSION" = "$now_version" ]; then
              echo "::error::the uploaded preview version is the version production is serving"
              exit 1
            fi
            echo "Production deployment unchanged: $now_deployment ($now_version)."
          else
            echo "::warning::no baseline deployment recorded — isolation asserted on hostname disjointness only"
          fi

          # Deliberately no production /health probe here. It would couple every
          # PR's verdict to production's own availability and DNS state (the
          # custom domain in #6 does not resolve yet, and the workers.dev host is
          # currently disabled), which is the production job's business and not
          # evidence about isolation. The deployment-id/version comparison above
          # is the stronger, host-independent invariant.

      - name: Smoke test preview deployment
        run: node scripts/smoke.mjs "${{ steps.upload.outputs.url }}"

      # One sticky comment per PR, rewritten on every push, so a busy PR does
      # not accumulate a comment per commit and reviewers always see the
      # current preview URL.
      - name: Comment preview URL on PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREVIEW_URL: ${{ steps.upload.outputs.url }}
          PREVIEW_VERSION: ${{ steps.upload.outputs.version }}
          PRODUCTION_DEPLOYMENT: ${{ steps.baseline.outputs.deployment }}
        run: |
          set -euo pipefail
          pr="${{ github.event.pull_request.number }}"
          sha="${{ github.event.pull_request.head.sha }}"
          {
            echo "<!-- preview-deployment -->"
            echo "### Preview deployment"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| Preview URL | $PREVIEW_URL |"
            echo "| Commit | <code>$sha</code> |"
            echo "| Worker version | <code>${PREVIEW_VERSION:-unknown}</code> (tag <code>pr-$pr</code>) |"
            echo "| Route-table smoke suite | passed |"
            echo "| Production | untouched — deployment <code>${PRODUCTION_DEPLOYMENT:-unknown}</code> unchanged |"
            echo
            echo "Immutable version upload (<code>wrangler versions upload</code>): no traffic moved, no deployment created. Merge to <code>main</code> to deploy."
            echo
            echo "<sub>Updated automatically on every push to this PR.</sub>"
          } > preview-comment.md

          existing=$(gh api "repos/$GITHUB_REPOSITORY/issues/$pr/comments?per_page=100" \
            --jq '[.[] | select(.body | contains("<!-- preview-deployment -->"))][0].id // empty')
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$existing" \
              -F body=@preview-comment.md > /dev/null
            echo "Updated the existing preview comment ($existing)."
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$pr/comments" \
              -F body=@preview-comment.md > /dev/null
            echo "Created the preview comment."
          fi

  production:
    name: Production deployment (main)
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') &&
      needs.prerequisites.outputs.deploy == 'true'
    needs: [prerequisites]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: Production
      url: ${{ vars.PRODUCTION_URL || 'https://bayside-bricks.me-6d3.workers.dev' }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node (from web/.nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Workers
        id: deploy
        run: |
          npx wrangler deploy -c dist/server/wrangler.json --message "${{ github.sha }}" | tee deploy.log

          # `|| true` is load-bearing: grep exits 1 when it finds nothing, and
          # under `set -e` + pipefail that aborted the step before the
          # diagnostic below could run (run 43356057677 failed with a bare
          # "Process completed with exit code 1" and no explanation).
          url=$(grep -oE 'https://[^[:space:]]+workers\.dev' deploy.log | head -n1 || true)
          if [ -z "$url" ]; then
            echo "::error::wrangler deployed, but its output has no workers.dev URL to smoke. \`\"workers_dev\": true\` in web/wrangler.jsonc is load-bearing: without it wrangler disables workers.dev whenever \`routes\` is present, which removes the only host that serves this build before the DNS cutover."
            grep -iE 'workers_dev|workers\.dev' deploy.log || true
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

          version=$(grep -oE 'Current Version ID: [0-9a-f]{8}-[0-9a-f-]{27}' deploy.log \
            | grep -oE '[0-9a-f]{8}-[0-9a-f-]{27}' | head -n1 || true)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Deployed $url (version ${version:-unknown})"

      # The deploy above applies the `routes` entry from web/wrangler.jsonc, so
      # the custom-domain binding is reproducible rather than a one-off
      # dashboard/API change. Verify it landed: `wrangler deploy` reports
      # success for the script upload even if the hostname were not attached,
      # and an unattached hostname only shows up as absent production traffic.
      # Also report zone activation, so a deploy that cannot yet serve the
      # domain looks pending rather than broken.
      - name: Verify custom domain binding
        id: domain
        env:
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DOMAIN: bricks.kitandsimon.com
          WORKER: bayside-bricks
          ZONE: kitandsimon.com
        run: |
          api=https://api.cloudflare.com/client/v4
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"

          domains=$(curl -sS --retry 3 --retry-delay 2 -H "$auth" \
            "$api/accounts/$CF_ACCOUNT_ID/workers/domains?per_page=50" || echo '{}')
          if [ "$(jq -r '.success // false' <<<"$domains")" = "true" ]; then
            bound=$(jq -r --arg d "$DOMAIN" --arg w "$WORKER" \
              '.result[] | select(.hostname == $d and .service == $w) | .hostname' <<<"$domains")
            if [ "$bound" != "$DOMAIN" ]; then
              echo "::error::$DOMAIN is not bound to Worker $WORKER. It is declared in web/wrangler.jsonc routes, so the deploy should have attached it — check the token's Workers Routes scope."
              exit 1
            fi
            echo "::notice::$DOMAIN is bound to $WORKER."
          else
            # Reading the custom-domain listing needs a Workers Routes read on
            # the token. The deploy has already proved the trigger landed:
            # wrangler prints the attached triggers from the API response. So a
            # token that cannot read the listing degrades this to a warning
            # instead of failing a deploy that is actually fine — but only when
            # the deploy's own output names the hostname.
            jq -r '.errors[]?.message' <<<"$domains" || true
            if grep -qF "$DOMAIN (custom domain)" deploy.log; then
              echo "::warning::could not list Worker custom domains with this token, but \`wrangler deploy\` reported '$DOMAIN (custom domain)' as an attached trigger. Add Workers Routes: Read (web/docs/deploy.md §2) to verify the binding from CI."
              bound="$DOMAIN (reported by wrangler deploy)"
            else
              echo "::error::could not list Worker custom domains and the deploy did not report $DOMAIN as an attached trigger — the token needs Zone → Workers Routes: Edit (web/docs/deploy.md §2)"
              exit 1
            fi
          fi
          echo "domain=$bound" >> "$GITHUB_OUTPUT"

          # Advisory: the zone cannot serve until the registrar delegates to
          # Cloudflare's nameservers (web/docs/deploy.md §4). A read failure is
          # not a deploy failure.
          zone=$(curl -sS --retry 3 --retry-delay 2 -H "$auth" \
            "$api/zones?name=$ZONE" 2>/dev/null || echo '{}')
          status=$(jq -r '.result[0].status // "unknown"' <<<"$zone" 2>/dev/null || echo unknown)
          echo "zone=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" != "active" ]; then
            echo "::warning::$ZONE zone status is '$status' (not active) — $DOMAIN will not resolve until the registrar points at Cloudflare's nameservers. The Worker is served on workers.dev in the meantime."
          fi

      # Smoke the Worker on the host it was actually deployed to. The custom
      # domain is only smoke-tested once PRODUCTION_URL points at it (after the
      # DNS cutover, web/docs/deploy.md §4) — before that it still resolves to
      # the old Deno Deploy site, which is not this build.
      - name: Smoke test the deployed Worker
        run: node scripts/smoke.mjs "${{ steps.deploy.outputs.url }}"

      - name: Smoke test the public URL
        if: vars.PRODUCTION_URL != ''
        env:
          PUBLIC_URL: ${{ vars.PRODUCTION_URL }}
        run: node scripts/smoke.mjs "$PUBLIC_URL"

      - name: Deployment summary
        env:
          WORKER_URL: ${{ steps.deploy.outputs.url }}
          PUBLIC_URL: ${{ vars.PRODUCTION_URL }}
          DOMAIN: bricks.kitandsimon.com
          ZONE_STATUS: ${{ steps.domain.outputs.zone }}
        run: |
          {
            echo "### Production deployment"
            echo
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Worker URL: $WORKER_URL"
            echo "- Custom domain: $DOMAIN — bound to \`bayside-bricks\` (declared in \`web/wrangler.jsonc\`)"
            echo "- Zone \`kitandsimon.com\`: $ZONE_STATUS"
            if [ "$ZONE_STATUS" != "active" ]; then
              echo
              echo "  The binding exists but the hostname will not resolve until the registrar delegates to Cloudflare's nameservers (\`web/docs/deploy.md\` §4). Until then this deployment is served on the workers.dev URL above."
            fi
            if [ -n "$PUBLIC_URL" ]; then
              echo "- Public URL: $PUBLIC_URL (smoke-tested)"
            else
              echo "- Public URL smoke: skipped — set the \`PRODUCTION_URL\` variable after the DNS cutover so every deploy smokes the real domain"
            fi
            echo "- Route-table smoke test: passed"
            echo
            echo "Rollback: \`npx wrangler rollback -c dist/server/wrangler.json\` or re-run this job on the last good commit (web/docs/deploy.md §5)."
          } >> "$GITHUB_STEP_SUMMARY"
