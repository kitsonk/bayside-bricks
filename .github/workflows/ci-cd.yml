name: CI/CD

# Replaces the legacy Deno Deploy workflow (.github/workflows/deploy.yml,
# deployctl -> Deno Deploy project `bayside-bricks`), retired with the move to
# Cloudflare Workers (MIGRATION_INVENTORY.md §11.1).
#
# Pipeline
#   CI        `.github/workflows/ci.yml`: install, typecheck, build, deploy dry
#             run and route-table tests on every push and PR. No secrets.
#   preview   PRs only:       upload an immutable Worker version, assert the
#                             live production deployment was not touched, smoke
#                             the preview URL, upsert one sticky PR comment
#   production push to main:  deploy the commit, then smoke the deployed Worker
#
# The deploy jobs rebuild from the same commit/lockfile that CI verified rather
# than downloading CI's artefact: artefacts are not shared across workflow runs,
# and a rebuild is required anyway to produce the adapter's `dist/server/
# wrangler.json`. Merge-time gating therefore comes from requiring the `CI`
# workflow (branch protection) — plus the post-deploy smoke below, which fails
# the job if the deployed Worker is unhealthy.
#
# Required repository secrets (see web/docs/deploy.md):
#   CLOUDFLARE_API_TOKEN    scoped Workers + zone token, nothing else
#   CLOUDFLARE_ACCOUNT_ID   Cloudflare account id
# Optional repository variable:
#   PRODUCTION_URL          public URL to smoke after deploy. Unset until the
#                           DNS cutover: the Worker is verified on its
#                           workers.dev host, which the deploy step discovers.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    # The Astro/Workers app lives in web/ until the scaffold is promoted to the
    # repository root (tracked by t_bc7cf085). Keep every path relative to it.
    working-directory: web
    # Required, not cosmetic: the deploy steps pipe wrangler's output into `tee`
    # to scrape the deployed URL. GitHub's default shell is `bash -e {0}`, which
    # has no `pipefail`, so the pipeline would exit with `tee`'s status (0) and a
    # failed deploy would report success. Explicit `bash` runs with `-eo pipefail`.
    shell: bash

jobs:
  # Deploying needs Cloudflare credentials. Rather than fail red on a repo
  # without them, detect once and let the deploy jobs no-op with a warning —
  # a fork, a fresh clone or a local secret-less run still gets a green CI on
  # the part that can actually run (verify). See web/docs/deploy.md.
  prerequisites:
    name: Deploy prerequisites
    runs-on: ubuntu-latest
    timeout-minutes: 2
    defaults:
      run:
        working-directory: .
    outputs:
      deploy: ${{ steps.check.outputs.deploy }}
    steps:
      - name: Check Cloudflare credentials
        id: check
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "Cloudflare credentials present."
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CLOUDFLARE_API_TOKEN and/or CLOUDFLARE_ACCOUNT_ID are not set — deploy jobs will be skipped. See web/docs/deploy.md."
          fi

  preview:
    name: Preview deployment (PR)
    # Same-repo PRs only: fork PRs get no secrets, so they cannot deploy.
    # Inputs used in shell below are numeric (PR number) or a commit SHA.
    #
    # Isolation model — a preview must not be able to affect production:
    #   * it uploads an immutable version (`wrangler versions upload`) and never
    #     `wrangler deploy`, so no traffic moves and no deployment is created;
    #   * it never declares `environment: Production`, so it cannot borrow the
    #     production environment's secrets or protection rules;
    #   * the "Assert production was not touched" step reads the live
    #     deployment before and after the upload and fails the job if either
    #     the active deployment id or its version changed — the guarantee is
    #     tested on every PR rather than assumed;
    #   * it refuses a preview URL that is the production host (see the URL
    #     parsing below).
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.prerequisites.outputs.deploy == 'true'
    needs: [prerequisites]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node (from web/.nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Baseline for the isolation assertion after the upload.
      - name: Record the live production deployment
        id: baseline
        run: |
          set -euo pipefail
          if ! json=$(npx wrangler deployments status -c dist/server/wrangler.json --json 2>/dev/null); then
            echo "::warning::could not read the live deployment; isolation will be asserted on the preview URL and production health only"
            json='{}'
          fi
          deployment=$(jq -r '.id // ""' <<<"$json")
          deployment="${deployment}-NEGATIVE-TEST" # TEMPORARY: prove the guard goes red
          version=$(jq -r '.versions[0].version_id // ""' <<<"$json")
          echo "deployment=$deployment" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Active production deployment before this run: ${deployment:-unknown} (version ${version:-unknown})"

      # An immutable version + preview URL: uploads without moving production
      # traffic. Production stays on the last `wrangler deploy` until merged.
      - name: Upload preview version
        id: upload
        run: |
          set -euo pipefail
          npx wrangler versions upload -c dist/server/wrangler.json \
            --tag "pr-${{ github.event.pull_request.number }}" \
            --message "PR #${{ github.event.pull_request.number }} @ ${{ github.event.pull_request.head.sha }}" \
            | tee version-upload.log

          # Parse the lines wrangler labels. Grepping for "the first workers.dev
          # URL" is unsafe: the production host is a workers.dev URL too, so a
          # wrong match would smoke — and pass — against production and call it
          # a preview.
          url=$(grep -F 'Version Preview URL:' version-upload.log | grep -oE 'https://[^[:space:]]+' | head -n1 || true)
          version=$(grep -F 'Worker Version ID:' version-upload.log | grep -oE '[0-9a-f]{8}-[0-9a-f-]{27}' | head -n1 || true)
          if [ -z "$url" ]; then
            echo "::error::could not find a 'Version Preview URL:' line in the wrangler output"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Preview URL: $url (version ${version:-unknown})"

      # The load-bearing check for "previews cannot affect production".
      - name: Assert production was not touched
        env:
          BASELINE_DEPLOYMENT: ${{ steps.baseline.outputs.deployment }}
          BASELINE_VERSION: ${{ steps.baseline.outputs.version }}
          PREVIEW_URL: ${{ steps.upload.outputs.url }}
          PREVIEW_VERSION: ${{ steps.upload.outputs.version }}
        run: |
          set -euo pipefail
          prod_url='https://bayside-bricks.me-6d3.workers.dev'

          case "${PREVIEW_URL%/}" in
            "$prod_url")
              echo "::error::the preview URL is the production host — this is not a preview"
              exit 1
              ;;
          esac

          if [ -n "$BASELINE_DEPLOYMENT" ]; then
            json=$(npx wrangler deployments status -c dist/server/wrangler.json --json)
            now_deployment=$(jq -r '.id // ""' <<<"$json")
            now_version=$(jq -r '.versions[0].version_id // ""' <<<"$json")
            echo "production before: $BASELINE_DEPLOYMENT / $BASELINE_VERSION"
            echo "production after:  $now_deployment / $now_version"
            if [ "$now_deployment" != "$BASELINE_DEPLOYMENT" ] || [ "$now_version" != "$BASELINE_VERSION" ]; then
              echo "::error::the preview upload changed the active production deployment — isolation is broken"
              exit 1
            fi
            if [ -n "$PREVIEW_VERSION" ] && [ "$PREVIEW_VERSION" = "$now_version" ]; then
              echo "::error::the uploaded preview version is the version production is serving"
              exit 1
            fi
            echo "Production deployment unchanged: $now_deployment ($now_version)."
          else
            echo "::warning::no baseline deployment recorded — asserting isolation on production health only"
          fi

          code=$(curl -s -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 2 "$prod_url/health")
          if [ "$code" != "200" ]; then
            echo "::error::production /health returned $code after the preview upload"
            exit 1
          fi
          echo "Production /health: 200."

      - name: Smoke test preview deployment
        run: node scripts/smoke.mjs "${{ steps.upload.outputs.url }}"

      # One sticky comment per PR, rewritten on every push, so a busy PR does
      # not accumulate a comment per commit and reviewers always see the
      # current preview URL.
      - name: Comment preview URL on PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREVIEW_URL: ${{ steps.upload.outputs.url }}
          PREVIEW_VERSION: ${{ steps.upload.outputs.version }}
          PRODUCTION_DEPLOYMENT: ${{ steps.baseline.outputs.deployment }}
        run: |
          set -euo pipefail
          pr="${{ github.event.pull_request.number }}"
          sha="${{ github.event.pull_request.head.sha }}"
          {
            echo "<!-- preview-deployment -->"
            echo "### Preview deployment"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| Preview URL | $PREVIEW_URL |"
            echo "| Commit | <code>$sha</code> |"
            echo "| Worker version | <code>${PREVIEW_VERSION:-unknown}</code> (tag <code>pr-$pr</code>) |"
            echo "| Route-table smoke suite | passed |"
            echo "| Production | untouched — deployment <code>${PRODUCTION_DEPLOYMENT:-unknown}</code> unchanged |"
            echo
            echo "Immutable version upload (<code>wrangler versions upload</code>): no traffic moved, no deployment created. Merge to <code>main</code> to deploy."
            echo
            echo "<sub>Updated automatically on every push to this PR.</sub>"
          } > preview-comment.md

          existing=$(gh api "repos/$GITHUB_REPOSITORY/issues/$pr/comments?per_page=100" \
            --jq '[.[] | select(.body | contains("<!-- preview-deployment -->"))][0].id // empty')
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$existing" \
              -F body=@preview-comment.md > /dev/null
            echo "Updated the existing preview comment ($existing)."
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$pr/comments" \
              -F body=@preview-comment.md > /dev/null
            echo "Created the preview comment."
          fi

  production:
    name: Production deployment (main)
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') &&
      needs.prerequisites.outputs.deploy == 'true'
    needs: [prerequisites]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: Production
      url: ${{ vars.PRODUCTION_URL || 'https://bayside-bricks.me-6d3.workers.dev' }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node (from web/.nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Workers
        id: deploy
        run: |
          npx wrangler deploy -c dist/server/wrangler.json --message "${{ github.sha }}" | tee deploy.log
          url=$(grep -oE 'https://[^[:space:]]+workers\.dev' deploy.log | head -n1)
          if [ -z "$url" ]; then
            echo "::error::could not find the deployed workers.dev URL in the wrangler output"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # Smoke the Worker on the host it was actually deployed to. The custom
      # domain is only smoke-tested once PRODUCTION_URL points at it (after the
      # DNS cutover, web/docs/deploy.md §4) — before that it still resolves to
      # the old Deno Deploy site, which is not this build.
      - name: Smoke test the deployed Worker
        run: node scripts/smoke.mjs "${{ steps.deploy.outputs.url }}"

      - name: Smoke test the public URL
        if: vars.PRODUCTION_URL != ''
        env:
          PUBLIC_URL: ${{ vars.PRODUCTION_URL }}
        run: node scripts/smoke.mjs "$PUBLIC_URL"

      - name: Deployment summary
        env:
          WORKER_URL: ${{ steps.deploy.outputs.url }}
          PUBLIC_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          {
            echo "### Production deployment"
            echo
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Worker URL: $WORKER_URL"
            if [ -n "$PUBLIC_URL" ]; then
              echo "- Public URL: $PUBLIC_URL (smoke-tested)"
            else
              echo "- Public URL: not set — custom domain not cut over yet (web/docs/deploy.md section 4)"
            fi
            echo "- Route-table smoke test: passed"
            echo
            echo "Rollback: \`npx wrangler rollback -c dist/server/wrangler.json\` or re-run this job on the last good commit (web/docs/deploy.md §5)."
          } >> "$GITHUB_STEP_SUMMARY"
