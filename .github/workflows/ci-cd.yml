name: CI/CD

# Replaces the legacy Deno Deploy workflow (.github/workflows/deploy.yml,
# deployctl -> Deno Deploy project `bayside-bricks`), retired with the move to
# Cloudflare Workers (MIGRATION_INVENTORY.md §11.1).
#
# Pipeline
#   CI        `.github/workflows/ci.yml`: install, typecheck, build, deploy dry
#             run and route-table tests on every push and PR. No secrets.
#   preview   PRs only:       upload an immutable Worker version, smoke its
#                             preview URL, comment on the PR
#   production push to main:  deploy the commit, then smoke the deployed Worker
#
# The deploy jobs rebuild from the same commit/lockfile that CI verified rather
# than downloading CI's artefact: artefacts are not shared across workflow runs,
# and a rebuild is required anyway to produce the adapter's `dist/server/
# wrangler.json`. Merge-time gating therefore comes from requiring the `CI`
# workflow (branch protection) — plus the post-deploy smoke below, which fails
# the job if the deployed Worker is unhealthy.
#
# Required repository secrets (see web/docs/deploy.md):
#   CLOUDFLARE_API_TOKEN    scoped Workers + zone token, nothing else
#                           (Workers Scripts: Edit + Workers Routes: Edit —
#                           the production job attaches the custom domain
#                           declared in web/wrangler.jsonc)
#   CLOUDFLARE_ACCOUNT_ID   Cloudflare account id
# Optional repository variable (may live on the `Production` environment):
#   PRODUCTION_URL          public URL to smoke after deploy. Unset until the
#                           DNS cutover: the Worker is verified on its
#                           workers.dev host, which the deploy step discovers.
#
# Production hostname: bricks.kitandsimon.com, declared as a `routes` entry
# with `custom_domain: true` in web/wrangler.jsonc. The adapter copies it into
# dist/server/wrangler.json, so `wrangler deploy` is the single source of truth
# for the binding — no dashboard step. Deploying that route works while the
# zone is still pending (it serves once the registrar points at Cloudflare).
# `wrangler versions upload` (previews) ignores triggers entirely, so a PR
# cannot move production traffic or rewrite the production route.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    # The Astro/Workers app lives in web/ until the scaffold is promoted to the
    # repository root (tracked by t_bc7cf085). Keep every path relative to it.
    working-directory: web
    # Required, not cosmetic: the deploy steps pipe wrangler's output into `tee`
    # to scrape the deployed URL. GitHub's default shell is `bash -e {0}`, which
    # has no `pipefail`, so the pipeline would exit with `tee`'s status (0) and a
    # failed deploy would report success. Explicit `bash` runs with `-eo pipefail`.
    shell: bash

jobs:
  # Deploying needs Cloudflare credentials. Rather than fail red on a repo
  # without them, detect once and let the deploy jobs no-op with a warning —
  # a fork, a fresh clone or a local secret-less run still gets a green CI on
  # the part that can actually run (verify). See web/docs/deploy.md.
  prerequisites:
    name: Deploy prerequisites
    runs-on: ubuntu-latest
    timeout-minutes: 2
    defaults:
      run:
        working-directory: .
    outputs:
      deploy: ${{ steps.check.outputs.deploy }}
    steps:
      - name: Check Cloudflare credentials
        id: check
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "Cloudflare credentials present."
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CLOUDFLARE_API_TOKEN and/or CLOUDFLARE_ACCOUNT_ID are not set — deploy jobs will be skipped. See web/docs/deploy.md."
          fi

  preview:
    name: Preview deployment (PR)
    # Same-repo PRs only: fork PRs get no secrets, so they cannot deploy.
    # Inputs used in shell below are numeric (PR number) or a commit SHA.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.prerequisites.outputs.deploy == 'true'
    needs: [prerequisites]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node (from web/.nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # An immutable version + preview URL: uploads without moving production
      # traffic. Production stays on the last `wrangler deploy` until merged.
      - name: Upload preview version
        id: upload
        run: |
          npx wrangler versions upload -c dist/server/wrangler.json \
            --tag "pr-${{ github.event.pull_request.number }}" \
            --message "PR #${{ github.event.pull_request.number }} @ ${{ github.event.pull_request.head.sha }}" \
            | tee version-upload.log
          url=$(grep -oE 'https://[^[:space:]]+workers\.dev' version-upload.log | head -n1)
          if [ -z "$url" ]; then
            echo "::error::could not find a preview URL in the wrangler output"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Smoke test preview deployment
        run: node scripts/smoke.mjs "${{ steps.upload.outputs.url }}"

      - name: Comment preview URL on PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREVIEW_URL: ${{ steps.upload.outputs.url }}
        run: |
          {
            echo "**Preview deployment:** $PREVIEW_URL"
            echo
            echo "Version \`pr-${{ github.event.pull_request.number }}\` uploaded from ${{ github.event.pull_request.head.sha }}."
            echo "Route-table smoke test passed against the preview URL."
            echo
            echo "_Production traffic is untouched; merge to \`main\` to deploy._"
          } > preview-comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file preview-comment.md

  production:
    name: Production deployment (main)
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') &&
      needs.prerequisites.outputs.deploy == 'true'
    needs: [prerequisites]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: Production
      url: ${{ vars.PRODUCTION_URL || 'https://bayside-bricks.me-6d3.workers.dev' }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node (from web/.nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Workers
        id: deploy
        run: |
          npx wrangler deploy -c dist/server/wrangler.json --message "${{ github.sha }}" | tee deploy.log
          url=$(grep -oE 'https://[^[:space:]]+workers\.dev' deploy.log | head -n1)
          if [ -z "$url" ]; then
            echo "::error::could not find the deployed workers.dev URL in the wrangler output"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # The deploy above applies the `routes` entry from web/wrangler.jsonc, so
      # the custom-domain binding is reproducible rather than a one-off
      # dashboard/API change. Verify it landed: `wrangler deploy` reports
      # success for the script upload even if the hostname were not attached,
      # and an unattached hostname only shows up as absent production traffic.
      # Also report zone activation, so a deploy that cannot yet serve the
      # domain looks pending rather than broken.
      - name: Verify custom domain binding
        id: domain
        env:
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DOMAIN: bricks.kitandsimon.com
          WORKER: bayside-bricks
          ZONE: kitandsimon.com
        run: |
          api=https://api.cloudflare.com/client/v4
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"

          domains=$(curl -sS --retry 3 --retry-delay 2 -H "$auth" \
            "$api/accounts/$CF_ACCOUNT_ID/workers/domains?per_page=50")
          if [ "$(jq -r '.success // false' <<<"$domains")" != "true" ]; then
            echo "::error::could not list Worker custom domains — the token needs Zone → Workers Routes: Edit and Workers Scripts: Edit (web/docs/deploy.md §2)"
            jq -r '.errors[]?.message' <<<"$domains" || true
            exit 1
          fi
          bound=$(jq -r --arg d "$DOMAIN" --arg w "$WORKER" \
            '.result[] | select(.hostname == $d and .service == $w) | .hostname' <<<"$domains")
          if [ "$bound" != "$DOMAIN" ]; then
            echo "::error::$DOMAIN is not bound to Worker $WORKER. It is declared in web/wrangler.jsonc routes, so the deploy should have attached it — check the token's Workers Routes scope."
            exit 1
          fi
          echo "::notice::$DOMAIN is bound to $WORKER."

          # Advisory: the zone cannot serve until the registrar delegates to
          # Cloudflare's nameservers (web/docs/deploy.md §4). A read failure is
          # not a deploy failure.
          zone=$(curl -sS --retry 3 --retry-delay 2 -H "$auth" \
            "$api/zones?name=$ZONE" 2>/dev/null || echo '{}')
          status=$(jq -r '.result[0].status // "unknown"' <<<"$zone" 2>/dev/null || echo unknown)
          echo "zone=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" != "active" ]; then
            echo "::warning::$ZONE zone status is '$status' (not active) — $DOMAIN will not resolve until the registrar points at Cloudflare's nameservers. The Worker is served on workers.dev in the meantime."
          fi

      # Smoke the Worker on the host it was actually deployed to. The custom
      # domain is only smoke-tested once PRODUCTION_URL points at it (after the
      # DNS cutover, web/docs/deploy.md §4) — before that it still resolves to
      # the old Deno Deploy site, which is not this build.
      - name: Smoke test the deployed Worker
        run: node scripts/smoke.mjs "${{ steps.deploy.outputs.url }}"

      - name: Smoke test the public URL
        if: vars.PRODUCTION_URL != ''
        env:
          PUBLIC_URL: ${{ vars.PRODUCTION_URL }}
        run: node scripts/smoke.mjs "$PUBLIC_URL"

      - name: Deployment summary
        env:
          WORKER_URL: ${{ steps.deploy.outputs.url }}
          PUBLIC_URL: ${{ vars.PRODUCTION_URL }}
          DOMAIN: bricks.kitandsimon.com
          ZONE_STATUS: ${{ steps.domain.outputs.zone }}
        run: |
          {
            echo "### Production deployment"
            echo
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Worker URL: $WORKER_URL"
            echo "- Custom domain: $DOMAIN — bound to \`bayside-bricks\` (declared in \`web/wrangler.jsonc\`)"
            echo "- Zone \`kitandsimon.com\`: $ZONE_STATUS"
            if [ "$ZONE_STATUS" != "active" ]; then
              echo
              echo "  The binding exists but the hostname will not resolve until the registrar delegates to Cloudflare's nameservers (\`web/docs/deploy.md\` §4). Until then this deployment is served on the workers.dev URL above."
            fi
            if [ -n "$PUBLIC_URL" ]; then
              echo "- Public URL: $PUBLIC_URL (smoke-tested)"
            else
              echo "- Public URL smoke: skipped — set the \`PRODUCTION_URL\` variable after the DNS cutover so every deploy smokes the real domain"
            fi
            echo "- Route-table smoke test: passed"
            echo
            echo "Rollback: \`npx wrangler rollback -c dist/server/wrangler.json\` or re-run this job on the last good commit (web/docs/deploy.md §5)."
          } >> "$GITHUB_STEP_SUMMARY"
